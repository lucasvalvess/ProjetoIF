{% extends "base.html" %}
{% block content %}
<h2>Lista de Projetos</h2>
<table class="tabela-listagem">
    <thead>
        <tr>
            <th>Título</th>
            <th>Categoria</th>
        </tr>
    </thead>
    <tbody>
        {% for projeto in projetos %}
        <tr>

            <td><a href="{% url 'extensao:detalhesProjeto' projeto.id %}">{{ projeto.titulo }}</a></td>

            <td>{{ projeto.categoria.nome }}</td>

        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock content %}
