{% extends "base.html" %}
{% block content %}
<h2>Detalhes do Aluno</h2>
<a href="{% url 'extensao:listaProjetos' %}" class="voltar">&larr; Voltar à lista</a>
<div class="cartao-detalhes">
    <p><strong>Nome:</strong> {{ aluno.nome }}</p>
    <p><strong>Matrícula:</strong> {{ aluno.matricula }}</p>
    <p><strong>Projetos:</strong></p>
    <ul>
        {% for projeto in aluno.projetos.all %}
        <li><a href="{% url 'extensao:detalhesProjeto' projeto.id %}">{{ projeto.titulo }}</a></li>
        {% endfor %}
    </ul>
</div>
{% endblock content %}
